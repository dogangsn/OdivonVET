project_id = "odivon-vet-clinic"
[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 55322
shadow_port = 55320
major_version = 17
[db.seed]
enabled = false
[studio]
enabled = true
port = 55323
[inbucket]
enabled = true
port = 55324
[storage]
enabled = true
file_size_limit = "20MiB"
[auth]
enabled = true
site_url = "http://localhost:4200"
additional_redirect_urls = ["http://localhost:4200/auth/callback*", "http://localhost:4200/auth/sign-in"]
jwt_expiry = 3600
enable_signup = false
minimum_password_length = 12
[auth.email]
enable_signup = false
enable_confirmations = true
[functions.message-worker]
verify_jwt = false
[functions.clinic-members]
verify_jwt = false

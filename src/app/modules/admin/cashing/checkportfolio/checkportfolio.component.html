<main class="p-8 w-full"><h1 class="text-3xl font-bold">Çek Portföyü</h1><p role="status" class="my-4">{{message}}</p><form class="flex flex-wrap gap-4 my-6" (ngSubmit)="save()"><label>Çek no<input class="block border p-3" name="number" [(ngModel)]="form.number" required></label><label>Banka<input class="block border p-3" name="bank" [(ngModel)]="form.bank"></label><label>Tutar<input class="block border p-3" type="number" min="0.01" step="0.01" name="amount" [(ngModel)]="form.amount" required></label><label>Vade<input class="block border p-3" type="date" name="due" [(ngModel)]="form.due_date" required></label><label>Durum<select class="block border p-3" name="status" [(ngModel)]="form.status"><option value="portfolio">Portföyde</option><option value="deposited">Bankaya verildi</option><option value="collected">Tahsil edildi</option><option value="returned">İade</option><option value="cancelled">İptal</option></select></label><button class="border p-3" [disabled]="busy">Kaydet</button></form><table class="w-full bg-card"><thead><tr><th>No</th><th>Banka</th><th>Tutar</th><th>Vade</th><th>Durum</th><th>İşlem</th></tr></thead><tbody><tr *ngFor="let r of rows"><td class="p-3">{{r.number}}</td><td>{{r.bank}}</td><td>{{r.amount | number:'1.2-2'}}</td><td>{{r.due_date | date:'shortDate'}}</td><td>{{r.status}}</td><td><button (click)="edit(r)" [disabled]="r.status==='collected'||r.status==='cancelled'">Düzenle</button></td></tr></tbody></table></main>

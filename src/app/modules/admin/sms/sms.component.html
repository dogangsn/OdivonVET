<main class="p-8 w-full"><h1 class="text-3xl font-bold">SMS İşlemleri</h1><p class="my-4" *ngIf="mode==='test'">Test modu: gerçek mesaj gönderilmez. Canlı gönderim Genel Ayarlar üzerinden açılır.</p><p role="status" class="my-4">{{message}}</p><form (ngSubmit)="send()" class="max-w-2xl"><label class="block my-4">Şablon<select class="block border p-3 w-full" name="template" [(ngModel)]="template" (change)="useTemplate()"><option value="">Şablon seç</option><option *ngFor="let t of templates" [value]="t.id">{{t.name || t.title}}</option></select></label><label class="block my-4">Telefonlar (virgülle ayırın)<textarea class="block border p-3 w-full" name="recipients" [(ngModel)]="recipients" required></textarea></label><label class="block my-4">Mesaj<textarea class="block border p-3 w-full" rows="4" name="body" [(ngModel)]="body" maxlength="10000" required></textarea></label><button class="border p-3" [disabled]="busy">Gönderim kuyruğuna al</button></form><div class="flex gap-4 my-6"><h2 class="text-xl font-bold">Gönderim geçmişi</h2><button class="border px-3" (click)="refresh()">Yenile</button></div><table class="w-full bg-card"><thead><tr><th>Alıcı</th><th>Mesaj</th><th>Durum</th><th>Tarih</th></tr></thead><tbody><tr *ngFor="let r of rows"><td class="p-3">{{r.recipient}}</td><td class="p-3">{{r.body}}</td><td class="p-3">{{r.provider_id?.startsWith('test-') ? 'Test tamamlandı' : r.state}} {{r.safe_error}}</td><td class="p-3">{{r.created_at | date:'short'}}</td></tr></tbody></table></main>

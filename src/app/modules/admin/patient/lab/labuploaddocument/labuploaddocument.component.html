<h2 mat-dialog-title>Laboratuvar dosyası yükle</h2><mat-dialog-content><p role="alert">{{message}}</p><label>Dosya<input type="file" (change)="onChange($event)"></label><p *ngIf="file">{{file.name}} · {{file.size}} bayt</p></mat-dialog-content><mat-dialog-actions><button mat-button (click)="closeDialog()">Vazgeç</button><button mat-flat-button color="primary" [disabled]="buttonDisabled || !file" (click)="addOrUpdateDocument()">Yükle</button></mat-dialog-actions>

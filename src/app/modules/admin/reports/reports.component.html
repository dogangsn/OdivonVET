<main class="p-8 w-full"><h1 class="text-3xl font-bold">Raporlar</h1><form class="flex flex-wrap gap-4 my-6" (ngSubmit)="load()"><label>Rapor<select class="block border p-2" name="kind" [(ngModel)]="kind"><option *ngFor="let k of kinds" [value]="k.value">{{k.label}}</option></select></label><label>Başlangıç<input class="block border p-2" type="date" name="from" [(ngModel)]="from" required></label><label>Bitiş<input class="block border p-2" type="date" name="to" [(ngModel)]="to" required></label><label>Şube<select class="block border p-2" name="branch" [(ngModel)]="branch"><option value="">Yetkili olduğum şubeler</option><option *ngFor="let b of branches" [value]="b.id">{{b.name}}</option></select></label><button class="border p-3" [disabled]="busy || !kind">Raporu getir</button></form><p role="alert">{{error}}</p><div class="flex gap-4 my-4"><button class="border p-2" [disabled]="!rows.length" (click)="csv()">CSV indir</button><button class="border p-2" [disabled]="!rows.length" (click)="print()">Yazdır / PDF kaydet</button></div><p *ngIf="!rows.length && !busy">Seçilen aralıkta kayıt bulunmuyor.</p><div class="overflow-auto"><table class="w-full bg-card"><thead><tr><th class="p-3 text-left border-b" *ngFor="let c of columns">{{c}}</th></tr></thead><tbody><tr *ngFor="let r of rows"><td class="p-3 border-b" *ngFor="let c of columns">{{r[c]}}</td></tr></tbody></table></div></main>
